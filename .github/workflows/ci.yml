name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # ubuntu-latest (26.04) has no Python 3.9, the oldest version the package supports
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest pyflakes certifi
      - run: pyflakes eval tests
      - run: pytest -q tests
