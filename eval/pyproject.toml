[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dlsbench"
version = "0.1.0"
description = "Evaluate any OpenAI-compatible model on DeepLitSearch"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
# The client deliberately has no required dependencies: it speaks HTTP+JSON with the
# standard library, so `python -m dlsbench.eval` works in a bare interpreter.
dependencies = []

[project.optional-dependencies]
# certifi fixes TLS verification on machines with a stale CA bundle (common on macOS).
client = ["certifi"]
test = ["pytest", "pyflakes"]

[tool.setuptools]
packages = ["dlsbench"]
